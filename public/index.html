<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b28a48"><meta name="description" content="StayPilot: crea guide digitali per i tuoi ospiti."><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><title>StayPilot — Ospitalità digitale</title>
<style>
:root{--gold:#b28a48;--gold-dark:#8f6a31;--ink:#24241f;--muted:#727168;--paper:#f8f7f3;--line:#e8e3d9;--white:#fff;--danger:#a53c35;--green:#3d765a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,4vw,56px);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em;font-size:21px}.brand img{width:34px;height:34px}.brand span{color:var(--gold)}.top small{color:var(--muted)}.wrap{max-width:1120px;margin:0 auto;padding:32px 20px 70px}.hero{padding:26px 0 24px;display:flex;justify-content:space-between;gap:24px;align-items:end}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold-dark);font-weight:800}.hero h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.055em;line-height:1.1;margin:7px 0 10px}.hero p{color:var(--muted);max-width:620px;margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 15px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}.btn.primary:hover{background:var(--gold-dark)}.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow:auto}.tab{border:0;background:transparent;padding:12px 15px;color:var(--muted);font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--gold-dark);border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0;box-shadow:0 3px 14px #33260a05}.card h2,.card h3{margin:0 0 6px;letter-spacing:-.025em}.card p{color:var(--muted);margin:0}.metric{font-size:32px;font-weight:800;letter-spacing:-.05em;margin:8px 0 2px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px}.section-head h2{margin:0;font-size:21px;letter-spacing:-.03em}.list{display:grid;gap:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item h3{margin:0;font-size:16px}.item p{margin:3px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px}.pill{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;border-radius:30px;padding:5px 9px;background:#f1eee6;color:#77623e}.pill.live{background:#e7f2e9;color:#286341}.pill.draft{background:#f4eadc;color:#8b6325}.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed #d7d0c4;border-radius:16px}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#59584f;font-weight:800}.field input,.field select,.field textarea{border:1px solid #ded9ce;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);width:100%;min-width:0}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #b28a4840;border-color:var(--gold)}.modalback{position:fixed;inset:0;background:#211c15a8;display:none;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}.modalback.show{display:flex}.modal{background:var(--paper);border-radius:20px;width:min(680px,100%);max-height:94vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.close{border:0;background:transparent;font-size:26px;color:var(--muted)}.notice{border-radius:12px;padding:12px 14px;background:#fff3d8;color:#795a1e;margin:12px 0}.notice.error{background:#fce8e6;color:#9a2e27}.notice.success{background:#e6f4e9;color:#25653d}.hidden{display:none!important}.auth{max-width:480px;margin:42px auto}.auth .card{padding:28px}.auth h1{letter-spacing:-.04em;margin:4px 0 8px;font-size:30px}.muted{color:var(--muted)}.authswitch{text-align:center;margin-top:15px;color:var(--muted)}.link{color:var(--gold-dark);font-weight:800;text-decoration:none}.publicguide{max-width:760px;margin:32px auto;padding:0 18px 60px}.guidehero{background:linear-gradient(135deg,#2b2923,#504533);color:#fff;padding:30px;border-radius:22px;margin-bottom:16px}.guidehero h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.05em;line-height:1.08;margin:10px 0}.guidehero p{color:#eee6d6}.guidepart{margin-bottom:12px}.guidepart h2{font-size:17px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}.setup{max-width:650px;margin:32px auto}.setup code{background:#eee9df;padding:2px 5px;border-radius:5px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#292820;color:white;border-radius:12px;z-index:30;max-width:90vw;box-shadow:0 10px 30px #0002}.toast.error{background:#8c302b}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}.top small{display:none}}@media(max-width:540px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding-top:18px}.card{padding:17px}.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="/icon.svg" alt=""><div>stay<span>pilot</span></div></div><small id="topStatus">Guide digitali per l'ospitalità</small><div id="topActions"></div></header>
<main id="app"><div class="wrap"><div class="card">Caricamento StayPilot…</div></div></main>
<div class="modalback" id="modalback"><section class="modal"><div class="modalhead"><h2 id="modalTitle">Modifica</h2><button class="close" id="modalClose" aria-label="Chiudi">×</button></div><div id="modalContent"></div></section></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.STAYPILOT_CONFIG||{};const app=document.querySelector('#app');const topActions=document.querySelector('#topActions');let sb=null,session=null,profile=null,properties=[],guides=[],activeTab='overview';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=s=>String(s||'guida').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,58)||'guida';
function toast(msg,error=false){const t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hidden','error');if(error)t.classList.add('error');setTimeout(()=>t.classList.add('hidden'),4200)}
function err(e){console.error(e);toast(e?.message||'Si è verificato un errore. Riprova.',true)}
function ready(){return cfg.supabaseUrl&&cfg.supabaseAnonKey&&cfg.supabaseUrl.startsWith('https://')&&!cfg.supabaseAnonKey.includes('YOUR_')}
function setup(){document.querySelector('#topStatus').textContent='Configurazione iniziale';topActions.innerHTML='';app.innerHTML=`<div class="wrap"><div class="setup"><div class="eyebrow">Primo avvio · 2 minuti</div><h1>Colleghiamo StayPilot al cloud.</h1><p class="muted">Inserisci la URL del progetto Supabase e la chiave pubblica anon/publishable. Questi dati identificano il progetto, ma <b>non inserire mai la service_role key</b> o la password del database.</p><div class="card" style="margin-top:22px"><form id="setupForm" class="formgrid"><div class="field full"><label for="su">Supabase Project URL</label><input id="su" required type="url" placeholder="https://xxxxxxxx.supabase.co"></div><div class="field full"><label for="sk">Publishable / anon key</label><textarea id="sk" required placeholder="Chiave pubblica del progetto"></textarea></div><div class="field full"><button class="btn primary" type="submit">Collega progetto</button></div></form><div class="notice">Prima di collegarti, crea un progetto Supabase e applica il file <code>supabase/schema.sql</code> dal menu SQL Editor. Non usare chiavi segrete in questa schermata. <b>Per rendere i link pubblici accessibili anche agli ospiti su altri telefoni, inserisci gli stessi due valori anche in <code>public/config.js</code> e ridistribuisci su Vercel.</b></div><p><a class="link" href="https://supabase.com/dashboard" target="_blank" rel="noreferrer">Apri Supabase ↗</a> · <a class="link" href="/README.md">Istruzioni del progetto</a></p></div></div></div>`;document.querySelector('#setupForm').onsubmit=e=>{e.preventDefault();const u=document.querySelector('#su').value.trim().replace(/\/$/,'');const k=document.querySelector('#sk').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u)||k.length<20){toast('Controlla URL e chiave pubblica Supabase.',true);return}localStorage.setItem('sp_supabase_url',u);localStorage.setItem('sp_supabase_anon',k);location.reload()}}
function initClient(){const url=localStorage.getItem('sp_supabase_url')||cfg.supabaseUrl;const key=localStorage.getItem('sp_supabase_anon')||cfg.supabaseAnonKey;if(!url||!key)return false;try{sb=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}catch(e){err(e);return false}}
function authView(mode='login'){const signup=mode==='signup';document.querySelector('#topStatus').textContent='Area host';topActions.innerHTML='';app.innerHTML=`<div class="wrap"><div class="auth"><div class="eyebrow">StayPilot Host Studio</div><section class="card"><h1>${signup?'Crea il tuo account':'Bentornato'}</h1><p class="muted">${signup?'Organizza le guide digitali delle tue strutture.':'Accedi per gestire strutture e guide.'}</p><form id="authForm" style="margin-top:22px" class="formgrid">${signup?`<div class="field full"><label>Nome e cognome</label><input name="full_name" required autocomplete="name" maxlength="100"></div><div class="field full"><label>Nome attività (facoltativo)</label><input name="company" autocomplete="organization" maxlength="120"></div>`:''}<div class="field full"><label>Email</label><input name="email" required type="email" autocomplete="email"></div><div class="field full"><label>Password (almeno 8 caratteri)</label><input name="password" required type="password" minlength="8" autocomplete="${signup?'new-password':'current-password'}"></div><div class="field full"><button class="btn primary" type="submit" style="width:100%">${signup?'Crea account':'Accedi'}</button></div></form><div class="authswitch">${signup?'Hai già un account?':'Non hai ancora un account?'} <a href="#" id="authSwitch" class="link">${signup?'Accedi':'Registrati'}</a></div><p id="authMsg" class="muted" style="font-size:13px;margin-top:12px"></p></section><p class="footer">Creando un account accetti di usare il servizio nel rispetto delle condizioni e della privacy applicabili.</p></div></div>`;document.querySelector('#authSwitch').onclick=e=>{e.preventDefault();authView(signup?'login':'signup')};document.querySelector('#authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),email=String(f.get('email')).trim(),password=String(f.get('password'));const msg=document.querySelector('#authMsg');msg.textContent='Attendi…';try{let r;if(signup){r=await sb.auth.signUp({email,password,options:{data:{full_name:String(f.get('full_name')||''),company:String(f.get('company')||'')}}});if(!r.error&&!r.data.session){msg.textContent='Account creato. Controlla la tua email per confermare la registrazione, poi accedi.';return}}else r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;session=r.data.session;await loadDashboard()}catch(ex){msg.textContent=ex.message||'Errore di autenticazione';}}}
async function loadDashboard(){if(!session){authView();return}document.querySelector('#topStatus').textContent=session.user.email||'Area host';topActions.innerHTML='<button class="btn small" id="logout">Esci</button>';document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();session=null;profile=null;authView()};try{const [p,g,pr]=await Promise.all([sb.from('properties').select('*').order('created_at',{ascending:false}),sb.from('guides').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle()]);if(p.error)throw p.error;if(g.error)throw g.error;if(pr.error)throw pr.error;properties=p.data||[];guides=g.data||[];profile=pr.data;renderDashboard()}catch(e){app.innerHTML=`<div class="wrap"><div class="notice error">${esc(e.message)}<br>Controlla di aver eseguito lo schema SQL in Supabase e di aver confermato l'email se richiesto.</div><button class="btn" id="reload">Riprova</button></div>`;document.querySelector('#reload').onclick=loadDashboard}}
function renderDashboard(){const countLive=guides.filter(g=>g.status==='published').length;app.innerHTML=`<div class="wrap"><section class="hero"><div><div class="eyebrow">Il tuo spazio di lavoro</div><h1>Ospitalità, senza complicazioni.</h1><p>Gestisci le strutture e crea guide digitali chiare, consultabili dagli ospiti con un link o un QR code.</p></div><button class="btn primary" id="newProperty">＋ Nuova struttura</button></section><section class="grid"><div class="card"><p>Le tue strutture</p><div class="metric">${properties.length}</div><p>Strutture registrate</p></div><div class="card"><p>Guide digitali</p><div class="metric">${guides.length}</div><p>Guide create</p></div><div class="card"><p>Guide pubblicate</p><div class="metric">${countLive}</div><p>Visibili agli ospiti</p></div></section><nav class="tabs" style="margin-top:28px"><button class="tab ${activeTab==='overview'?'active':''}" data-tab="overview">Panoramica</button><button class="tab ${activeTab==='properties'?'active':''}" data-tab="properties">Strutture</button><button class="tab ${activeTab==='guides'?'active':''}" data-tab="guides">Guide</button><button class="tab ${activeTab==='account'?'active':''}" data-tab="account">Account</button></nav><section id="tabContent"></section><p class="footer">StayPilot Cloud MVP · Account: ${esc(session.user.email)} · Abbonamenti in modalità demo</p></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderDashboard()});document.querySelector('#newProperty').onclick=()=>propertyModal();const c=document.querySelector('#tabContent');if(activeTab==='overview'){c.innerHTML=`<div class="grid"><div class="card" style="grid-column:span 2"><div class="section-head"><h2>Attività recenti</h2><button class="btn small" id="allGuides">Vedi tutte le guide</button></div>${guides.length?guideList(guides.slice(0,4)):`<div class="empty"><strong>La tua prima guida inizia qui</strong>Aggiungi una struttura, poi crea una guida e pubblicala quando è pronta.</div>`}</div><div class="card"><h2>Parti da qui</h2><p style="margin:8px 0 16px">1. Inserisci i dati della struttura<br>2. Crea una guida<br>3. Pubblica e condividi il link</p><button class="btn primary" id="newGuide">Crea una guida</button><div class="notice" style="margin-top:16px">Non inserire dati personali non necessari degli ospiti. Le guide pubblicate sono accessibili a chiunque possieda il link.</div></div></div>`;document.querySelector('#allGuides').onclick=()=>{activeTab='guides';renderDashboard()};document.querySelector('#newGuide').onclick=()=>guideModal()}else if(activeTab==='properties'){c.innerHTML=`<div class="section-head"><h2>Le tue strutture</h2><button class="btn primary" id="newProperty2">＋ Aggiungi</button></div>${properties.length?`<div class="grid">${properties.map(p=>`<article class="card"><div class="eyebrow">${esc(p.type)}</div><h3 style="margin-top:8px">${esc(p.name)}</h3><p>${esc(p.address||'Indirizzo non inserito')}</p><p style="margin-top:8px">Check-in ${esc(p.checkin)} · Check-out ${esc(p.checkout)}</p><div class="actions" style="margin-top:16px"><button class="btn small" data-edit-property="${p.id}">Modifica</button><button class="btn small" data-add-guide="${p.id}">Crea guida</button><button class="btn small danger" data-delete-property="${p.id}">Elimina</button></div></article>`).join('')}</div>`:`<div class="empty"><strong>Nessuna struttura ancora</strong>Aggiungi la prima struttura per iniziare.</div>`}`;document.querySelector('#newProperty2').onclick=()=>propertyModal();c.querySelectorAll('[data-edit-property]').forEach(b=>b.onclick=()=>propertyModal(properties.find(p=>p.id===b.dataset.editProperty)));c.querySelectorAll('[data-add-guide]').forEach(b=>b.onclick=()=>guideModal(null,b.dataset.addGuide));c.querySelectorAll('[data-delete-property]').forEach(b=>b.onclick=()=>deleteProperty(b.dataset.deleteProperty))}else if(activeTab==='guides'){c.innerHTML=`<div class="section-head"><h2>Guide digitali</h2><button class="btn primary" id="newGuide2">＋ Nuova guida</button></div>${guides.length?`<div class="card">${guideList(guides)}</div>`:`<div class="empty"><strong>Nessuna guida creata</strong>Le guide pubblicate avranno un link da condividere con i tuoi ospiti.</div>`}`;document.querySelector('#newGuide2').onclick=()=>guideModal();c.querySelectorAll('[data-edit-guide]').forEach(b=>b.onclick=()=>guideModal(guides.find(g=>g.id===b.dataset.editGuide)));c.querySelectorAll('[data-toggle-guide]').forEach(b=>b.onclick=()=>toggleGuide(b.dataset.toggleGuide));c.querySelectorAll('[data-delete-guide]').forEach(b=>b.onclick=()=>deleteGuide(b.dataset.deleteGuide));c.querySelectorAll('[data-copy-guide]').forEach(b=>b.onclick=()=>copyGuide(b.dataset.copyGuide));c.querySelectorAll('[data-qr-guide]').forEach(b=>b.onclick=()=>showQr(b.dataset.qrGuide))}else{c.innerHTML=`<div class="card"><div class="eyebrow">Profilo</div><h2>${esc(profile?.full_name||session.user.user_metadata?.full_name||'Host')}</h2><p>${esc(session.user.email)}</p><p style="margin-top:12px">Piano attuale: <b>${esc(profile?.plan||'starter')}</b> · Stato account: <b>${esc(profile?.account_status||'da verificare')}</b></p><div class="notice">Piani e pagamenti sono informativi in questa versione. Non sono attivi addebiti automatici né fatturazione elettronica.</div><button class="btn" id="resetConfig">Riconfigura Supabase su questo browser</button></div>`;document.querySelector('#resetConfig').onclick=()=>{if(confirm('Rimuovere la configurazione locale di Supabase da questo browser?')){localStorage.removeItem('sp_supabase_url');localStorage.removeItem('sp_supabase_anon');location.reload()}}}}
function guideList(items){return `<div class="list">${items.map(g=>`<div class="item"><div style="min-width:0;flex:1"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(g.title)}</h3><span class="pill ${g.status==='published'?'live':'draft'}">${g.status==='published'?'Pubblicata':'Bozza'}</span></div><p>/g/${esc(g.slug)}</p></div><div class="actions"><button class="btn small" data-edit-guide="${g.id}">Modifica</button>${g.status==='published'?`<button class="btn small" data-copy-guide="${g.id}">Copia link</button><button class="btn small" data-qr-guide="${g.id}">QR code</button>`:''}<button class="btn small" data-toggle-guide="${g.id}">${g.status==='published'?'Rendi bozza':'Pubblica'}</button><button class="btn small danger" data-delete-guide="${g.id}">Elimina</button></div></div>`).join('')}</div>`}
function openModal(title,html,onSubmit){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalContent').innerHTML=html;document.querySelector('#modalback').classList.add('show');document.querySelector('#modalClose').onclick=closeModal;document.querySelector('#modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()};const form=document.querySelector('#modalContent form');if(form)form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Salvataggio…';try{await onSubmit(new FormData(form))}catch(ex){err(ex);btn.disabled=false;btn.textContent='Salva'}}}
function closeModal(){document.querySelector('#modalback').classList.remove('show')}
function propertyModal(p=null){const edit=!!p;openModal(edit?'Modifica struttura':'Aggiungi struttura',`<form class="formgrid"><div class="field full"><label>Nome struttura *</label><input name="name" required maxlength="120" value="${esc(p?.name||'')}"></div><div class="field"><label>Tipologia</label><select name="type">${['Hotel','Residence','B&B / Affittacamere','Casa vacanze','Agriturismo','Montagna / Chalet','Altro'].map(x=>`<option ${p?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Indirizzo</label><input name="address" value="${esc(p?.address||'')}"></div><div class="field"><label>Telefono</label><input name="phone" value="${esc(p?.phone||'')}"></div><div class="field"><label>Email contatto</label><input name="email" type="email" value="${esc(p?.email||'')}"></div><div class="field"><label>Check-in</label><input name="checkin" value="${esc(p?.checkin||'15:00')}"></div><div class="field"><label>Check-out</label><input name="checkout" value="${esc(p?.checkout||'10:00')}"></div><div class="field"><label>Nome Wi-Fi</label><input name="wifi_name" value="${esc(p?.wifi_name||'')}"></div><div class="field"><label>Password Wi-Fi</label><input name="wifi_password" value="${esc(p?.wifi_password||'')}"></div><div class="field full"><label>Note interne per la guida (non inserire dati sensibili)</label><textarea name="notes">${esc(p?.notes||'')}</textarea></div><div class="field full"><button class="btn primary" type="submit">Salva struttura</button></div></form>`,async f=>{const data={owner_id:session.user.id,name:String(f.get('name')).trim(),type:f.get('type'),address:String(f.get('address')||''),phone:String(f.get('phone')||''),email:String(f.get('email')||''),checkin:String(f.get('checkin')||'15:00'),checkout:String(f.get('checkout')||'10:00'),wifi_name:String(f.get('wifi_name')||''),wifi_password:String(f.get('wifi_password')||''),notes:String(f.get('notes')||''),updated_at:new Date().toISOString()};const r=edit?await sb.from('properties').update(data).eq('id',p.id):await sb.from('properties').insert(data);if(r.error)throw r.error;closeModal();toast('Struttura salvata');await loadDashboard()})}
function guideModal(g=null,propertyId=null){if(!properties.length){toast('Aggiungi prima una struttura.',true);activeTab='properties';renderDashboard();return}const edit=!!g;const selected=propertyId||g?.property_id||properties[0].id;openModal(edit?'Modifica guida':'Crea guida digitale',`<form class="formgrid"><div class="field full"><label>Struttura *</label><select name="property_id">${properties.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field full"><label>Titolo guida *</label><input name="title" required maxlength="160" value="${esc(g?.title||'Benvenuti')}</div><div class="field"><label>Lingua</label><select name="language">${[['it','Italiano'],['en','English'],['fr','Français'],['de','Deutsch'],['es','Español'],['ru','Русский']].map(([v,l])=>`<option value="${v}" ${(g?.language||'it')===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Colore guida</label><input type="color" name="theme" value="${esc(g?.theme||'#b28a48')}"></div><div class="field full"><label>Messaggio di benvenuto</label><textarea name="welcome">${esc(g?.welcome||'Benvenuti! Siamo felici di ospitarvi. In questa guida trovate le informazioni utili per il vostro soggiorno.')}</textarea></div><div class="field full"><label>Descrizione breve</label><textarea name="description">${esc(g?.description||'La vostra guida digitale, sempre a portata di mano.')}</textarea></div><div class="field full"><label>Informazioni check-in</label><textarea name="checkin_info">${esc(g?.checkin_info||'Indicate qui orario e istruzioni di arrivo.')}</textarea></div><div class="field full"><label>Informazioni check-out</label><textarea name="checkout_info">${esc(g?.checkout_info||'Indicate qui l’orario di partenza e la restituzione delle chiavi.')}</textarea></div><div class="field full"><label>Wi-Fi (visibile agli ospiti quando la guida è pubblicata)</label><textarea name="wifi_info">${esc(g?.wifi_info||'Rete e password Wi-Fi: inserisci qui le informazioni per gli ospiti.')}</textarea></div><div class="field full"><label>Regole della casa</label><textarea name="house_rules">${esc(g?.house_rules||'Rispetta il vicinato e gli orari di silenzio. Lascia gli ambienti in ordine.')}</textarea></div><div class="field full"><label>Consigli locali / servizi</label><textarea name="local_tips">${esc(g?.local_tips||'Aggiungi ristoranti, spiagge, trasporti, farmacie e luoghi da visitare.')}</textarea></div><div class="field full"><label>Indirizzo della struttura</label><input name="address" value="${esc(g?.address||properties.find(p=>p.id===selected)?.address||'')}"></div><div class="field full"><label>WhatsApp (numero internazionale, facoltativo)</label><input name="whatsapp" placeholder="393331234567" value="${esc(g?.whatsapp||'')}"></div><div class="field full"><label>URL guida (slug) *</label><input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" value="${esc(g?.slug||slugify(g?.title||'benvenuti-'+(properties.find(p=>p.id===selected)?.name||'struttura')))}"><small class="muted">Solo lettere minuscole, numeri e trattini. Deve essere unico.</small></div><div class="field full"><button class="btn primary" type="submit">Salva guida</button></div></form>`,async f=>{const data={owner_id:session.user.id,property_id:String(f.get('property_id')),title:String(f.get('title')).trim(),slug:slugify(String(f.get('slug')).trim()),language:String(f.get('language')),theme:String(f.get('theme')),welcome:String(f.get('welcome')||''),description:String(f.get('description')||''),checkin_info:String(f.get('checkin_info')||''),checkout_info:String(f.get('checkout_info')||''),wifi_info:String(f.get('wifi_info')||''),house_rules:String(f.get('house_rules')||''),local_tips:String(f.get('local_tips')||''),address:String(f.get('address')||''),whatsapp:String(f.get('whatsapp')||'').replace(/[^\d+]/g,''),updated_at:new Date().toISOString()};const r=edit?await sb.from('guides').update(data).eq('id',g.id):await sb.from('guides').insert({...data,status:'draft'});if(r.error)throw r.error;closeModal();toast('Guida salvata come bozza');activeTab='guides';await loadDashboard()})}
async function deleteProperty(id){if(!confirm('Eliminare la struttura? Anche le guide associate verranno eliminate.'))return;const r=await sb.from('properties').delete().eq('id',id);if(r.error)return err(r.error);toast('Struttura eliminata');await loadDashboard()}
async function deleteGuide(id){if(!confirm('Eliminare questa guida?'))return;const r=await sb.from('guides').delete().eq('id',id);if(r.error)return err(r.error);toast('Guida eliminata');await loadDashboard()}
async function toggleGuide(id){const g=guides.find(x=>x.id===id);if(!g)return;const r=await sb.from('guides').update({status:g.status==='published'?'draft':'published',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return err(r.error);toast(g.status==='published'?'Guida spostata in bozza':'Guida pubblicata');await loadDashboard()}
async function copyGuide(id){const g=guides.find(x=>x.id===id);if(!g)return;const url=location.origin+'/g/'+g.slug;try{await navigator.clipboard.writeText(url);toast('Link copiato: '+url)}catch{prompt('Copia il link della guida:',url)}}
function showQr(id){const g=guides.find(x=>x.id===id);if(!g)return;const url=location.origin+'/g/'+g.slug;openModal('QR code della guida',`<div style="text-align:center"><p class="muted">Scansiona il codice per aprire la guida pubblica. Stampa o salva l'immagine.</p><img alt="QR code per ${esc(g.title)}" width="240" height="240" style="width:240px;height:240px;max-width:100%;background:white;padding:10px;border:1px solid var(--line);border-radius:12px" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}"><p style="overflow-wrap:anywhere"><a class="link" target="_blank" rel="noreferrer" href="${esc(url)}">${esc(url)}</a></p><div class="actions" style="justify-content:center"><button class="btn" id="copyQrLink">Copia link</button><a class="btn primary" download="staypilot-qr-${esc(g.slug)}.png" target="_blank" rel="noreferrer" href="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(url)}">Apri QR grande</a></div><p class="muted" style="font-size:12px">Per generare il QR viene richiesto un servizio esterno con il solo URL pubblico della guida.</p></div>`);document.querySelector('#copyQrLink').onclick=()=>copyGuide(id)}
async function publicGuide(){const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');document.querySelector('#topStatus').textContent='Guida ospite';topActions.innerHTML='<a class="btn small" href="/">Area host</a>';app.innerHTML='<div class="wrap"><div class="card">Caricamento guida…</div></div>';try{const {data,error}=await sb.from('guides').select('title,slug,status,language,welcome,description,checkin_info,checkout_info,wifi_info,house_rules,local_tips,address,whatsapp,theme').eq('slug',slug).eq('status','published').maybeSingle();if(error)throw error;if(!data){app.innerHTML='<div class="publicguide"><div class="empty"><strong>Guida non disponibile</strong>Il link potrebbe essere errato oppure la guida non è pubblicata.</div></div>';return}const g=data,parts=[['Arrivo e check-in',g.checkin_info,'🗝️'],['Wi-Fi',g.wifi_info,'⌁'],['Regole della casa',g.house_rules,'⌂'],['Check-out',g.checkout_info,'✓'],['Consigli e servizi',g.local_tips,'✦']].filter(x=>x[1]);const address=g.address;app.innerHTML=`<div class="publicguide"><div class="eyebrow">La tua guida digitale · StayPilot</div><header class="guidehero" style="background:linear-gradient(135deg,#2b2923,${esc(g.theme||'#b28a48')})"><div style="font-size:12px;letter-spacing:.13em;text-transform:uppercase;opacity:.8">Benvenuti</div><h1>${esc(g.title)}</h1><p>${esc(g.description)}</p><p style="white-space:pre-line">${esc(g.welcome)}</p>${address?`<a class="btn" style="margin-top:8px" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}" target="_blank" rel="noreferrer">↗ Indicazioni stradali</a>`:''}${g.whatsapp?` <a class="btn" style="margin-top:8px" href="https://wa.me/${encodeURIComponent(g.whatsapp.replace(/\D/g,''))}" target="_blank" rel="noreferrer">WhatsApp</a>`:''}</header>${parts.map(([t,v,icon])=>`<section class="card guidepart"><h2>${icon} ${esc(t)}</h2><p style="white-space:pre-line">${esc(v)}</p></section>`).join('')}<div class="footer">Guida digitale realizzata con StayPilot</div></div>`;document.title=g.title+' — StayPilot'}catch(e){app.innerHTML=`<div class="wrap"><div class="notice error">${esc(e.message)}<br>Verifica che la configurazione Supabase sia valida e che lo schema SQL sia stato applicato.</div></div>`}}
async function start(){if(!ready()&&!localStorage.getItem('sp_supabase_url')){setup();return}if(!initClient()){setup();return}if(location.pathname.startsWith('/g/')){await publicGuide();return}const {data}=await sb.auth.getSession();session=data.session;if(session)await loadDashboard();else authView();sb.auth.onAuthStateChange((_event,s)=>{session=s;if(!location.pathname.startsWith('/g/')){if(s)loadDashboard();else authView()}})}
start();
</script>
</body></html>
